<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Modern Building Architecture -->
  <g filter="url(#glow)">
    <!-- Tower Main -->
    <path d="M 256,100 L 360,160 L 360,340 L 256,400 L 152,340 L 152,160 Z" fill="none" stroke="url(#iconGrad)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Roof Line & Inner Structure -->
    <path d="M 256,100 L 256,400 M 152,160 L 256,220 L 360,160" fill="none" stroke="url(#iconGrad)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Windows Accent -->
    <rect x="184" y="240" width="40" height="50" rx="8" fill="#a5b4fc" opacity="0.8" />
    <rect x="288" y="240" width="40" height="50" rx="8" fill="#a5b4fc" opacity="0.8" />
    
    <!-- Drip Drop Accent -->
    <path d="M 256,330 C 256,330 300,380 300,410 C 300,434 280,454 256,454 C 232,454 212,434 212,410 C 212,380 256,330 256,330 Z" fill="url(#dropGrad)" />
  </g>
</svg>
